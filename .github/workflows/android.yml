name: Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify installable APK was produced
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q '^AndroidManifest.xml$'
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          echo "APK size: $(stat -c%s "$APK") bytes"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: The-Robbots-Player-Iron-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
