name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK structure
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -qx 'classes.dex'
          file "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: The-Robbots-Player-Iron-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download as test pre-release
        if: github.ref == 'refs/heads/iron-edition-ui-2026'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="iron-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk#The-Robbots-Player-Iron-Test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Iron Edition test build ${GITHUB_RUN_NUMBER}" \
            --notes "TEST BUILD ONLY. APK structure validated by CI; device playback and design are not yet verified. Does not replace the stable player." \
            --prerelease
